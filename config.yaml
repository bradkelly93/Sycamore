# Sycamore Interview Prep Toolkit — runtime config.
# Edit edgar.user_agent before running anything that hits SEC.

edgar:
  # SEC requires a descriptive User-Agent with a real contact string.
  # Format: "Project/Version contact@example.com"
  user_agent: "sycamore-prep/0.1 bradley.kelly93@gmail.com"
  base_url: "https://data.sec.gov"
  ticker_map_url: "https://www.sec.gov/files/company_tickers.json"
  # EDGAR full-text search (spin-off discovery). Different host (efts.sec.gov).
  fts_base_url: "https://efts.sec.gov/LATEST/search-index"
  # Max requests/sec we will issue (SEC limit is ~10).
  rate_limit_rps: 8

cache:
  dir: "data/cache"

raw:
  dir: "data/raw"
  iws_holdings: "iws_holdings.csv"
  iwn_holdings: "iwn_holdings.csv"
  sycamore_holdings: "sycamore_holdings.csv"

valuation:
  # Defaults used by reverse_dcf and the Excel models; CLI flags override.
  wacc: 0.09
  terminal_growth: 0.025
  forecast_years: 10

spinoffs:
  # Form 10 family that registers a spin-off SpinCo. `forms=10-12B` in
  # full-text search returns base + /A amendments.
  forms: ["10-12B"]
  # Default lookback window for `spinoffs scan`.
  lookback_days: 540
  # Near-universal phrase in a Form 10 information statement — used as the
  # full-text-search query so a forms-only scan still returns hits.
  query: "information statement"

# Volatility overlay (tastytrade). DOWNSIDE CROSS-CHECK ONLY — reads
# market-level IV metrics for names under research; never positions, never
# orders. Auth is OAuth2 (username/password session-tokens were discontinued
# 2025-12-01). Credentials are NOT stored here (this file is committed) — set
# them in the environment after creating an OAuth app + personal grant (all
# three are required and must come from the SAME app):
#   export TASTYTRADE_CLIENT_ID=...
#   export TASTYTRADE_CLIENT_SECRET=...
#   export TASTYTRADE_REFRESH_TOKEN=...
tastytrade:
  base_url: "https://api.tastyworks.com"
  user_agent: "sycamore-prep/0.1 (volatility-overlay)"
  api_version: "20251101"
  # Default expected-move horizon in calendar days.
  horizon_days: 30

# Peer maps for comps. Override per-run via CLI --peers.
peers:
  CW:  ["HEI", "TDG", "MOG.A", "KTOS", "CACI"]
  WES: ["EPD", "ET", "MPLX", "PAGP"]
  UMBF: ["CFR", "PB", "PNFP", "GBCI", "ASB"]
  LECO: ["IEX", "ROP", "DOV", "PNR", "WTS"]
  MTDR: ["MGY", "PR", "SM", "CIVI", "CRGY"]

# Test tickers used in Phase 1 acceptance.
test_tickers: ["CW", "WES", "UMBF", "LECO", "MTDR"]

# Technical overlay (NON-PRIMARY context; never enters the three-attribute
# score). Surfaced by `screen --tv-overlay` as extra columns to the RIGHT of the
# downside flags. See README "TradingView technical overlay". mode selects source:
#   trend -> transparent Bull/Neutral/Bear regime computed in Python from the
#            prices we already pull (no TradingView account; fully auditable).
#   csv   -> read data/raw/<csv_file> (e.g. a custom Pine indicator's tickers).
#   api   -> replicate a built-in TradingView Stock Screener live (RSI/SMA/...).
tradingview:
  enabled: true
  mode: trend
  divergence_strong_pctile: 0.70     # "strong fundamentals" cut on the PURE composite
  pass_values: ["Bull"]              # regime/label values that count as a "pass"

  # --- mode: csv ---
  csv_file: trend_chameleon.csv      # drop in data/raw/ ; needs a `ticker` column
  signal_column: ""                  # e.g. "regime" — derive pass from this label column

  # --- mode: api (built-in Stock Screener) ---
  # Declarative replica. AND-combined. {field, op, value}. op in: gt, lt, ge, le,
  # eq, between, isin, above, below, crosses_above, crosses_below. For
  # above/below/crosses_*, value is ANOTHER FIELD NAME.
  region: america
  select: ["close", "RSI", "SMA200", "volume", "market_cap_basic"]
  filters:
    - {field: market_cap_basic, op: between, value: [300000000, 10000000000]}
    - {field: close, op: above, value: SMA200}
    - {field: RSI, op: lt, value: 70}
    - {field: volume, op: gt, value: 500000}
  cache_ttl_minutes: 1440
  max_results: 20000
  # sessionid: null    # realtime needs your own TradingView sessionid (or TV_SESSIONID)
# Prediction-market overlay (Polymarket). NON-PRIMARY signal layer — see
# CLAUDE.md. Read-only (no trading); never feeds the screener composite.
polymarket:
  gamma_base_url: "https://gamma-api.polymarket.com"
  clob_base_url: "https://clob.polymarket.com"
  rate_limit_rps: 5
  user_agent: "sycamore-prep/0.1 bradley.kelly93@gmail.com"
  # Minimum relevance (0–1) for `prediction-discover` to auto-include a match.
  min_relevance: 0.45

prediction:
  mapping_csv: "prediction_markets.csv"
  contradiction_prob: 0.20
  # Minimum days to resolution for a market to carry forward-looking signal. A
  # market resolving in ~2 weeks is nearly decided, so its implied prob is
  # backward-looking (a "Fed cut by the meeting 2 weeks out" sits near 0/1).
  # Markets resolving sooner are dropped in discovery + overlay; ones with no
  # parsable date are kept. 0 disables the filter.
  min_days_to_resolution: 30
  # Max candidate markets kept per search query (after relevance filtering).
  # Threshold-laddered markets ("Bitcoin reach $100k/$110k/.../$500k", the WTI
  # strike ladder) otherwise return dozens of near-identical rows per name. Keep
  # the top-N by relevance, tie-broken by traded volume. 0 disables the cap.
  max_markets_per_query: 3
  # Crypto/sports/pop-culture markets are dropped in the COMPANY + PEER
  # apertures (short peer tickers like ET/PR/ASB collide with "Eastern Time",
  # "People's Republic", "ASB Classic"). The MACRO aperture is NOT filtered —
  # a long-dated crypto market is kept there as a risk-appetite/liquidity gauge.
  # Tokens are matched whole (not substring), case-insensitive. Edit freely.
  noise_category_tokens:
    - crypto
    - bitcoin
    - ethereum
    - solana
    - dogecoin
    - xrp
    - bnb
    - sports
    - esports
    - soccer
    - tennis
    - basketball
    - baseball
    - hockey
    - football
    - nba
    - nfl
    - mlb
    - nhl
    - ufc
    - mma
    - golf
    - celebrities
    - celebrity
    - music
    - culture
    - entertainment
    - movies
  # Industry aperture: GICS sector → keyword searches on Polymarket.
  sector_keywords:
    Energy: ["oil price", "WTI crude", "OPEC production", "natural gas price"]
    Financials: ["bank failure", "Fed rate cut", "US recession"]
    Industrials: ["US recession", "government shutdown", "tariffs"]
    "Health Care": ["FDA approval", "Medicare", "drug pricing"]
    Materials: ["copper price", "gold price", "China GDP"]
    "Information Technology": ["AI regulation", "chip export ban"]
    "Consumer Discretionary": ["US recession", "consumer spending"]
  # Macro aperture: broad markets + the sectors they read through to.
  macro_markets:
    - query: "Fed rate cut 2026"
      applies_to: ["Financials", "Real Estate", "Utilities", "Consumer Discretionary"]
    - query: "US recession 2026"
      applies_to: ["*"]
    - query: "WTI crude oil price 2026"
      applies_to: ["Energy", "Materials"]
    # NON-PRIMARY risk-appetite / liquidity gauge, NOT a per-company signal.
    # Scoped to risk-on sectors; segregated in the macro aperture (never feeds
    # the screener). "reach" keeps the long-dated price-level market and drops
    # the intraday "up or down" scalps below the relevance threshold.
    - query: "Bitcoin reach 2026"
      applies_to: ["Energy", "Materials", "Consumer Discretionary", "Financials"]
