# Sycamore Interview Prep Toolkit — runtime config.
# Edit edgar.user_agent before running anything that hits SEC.

edgar:
  # SEC requires a descriptive User-Agent with a real contact string.
  # Format: "Project/Version contact@example.com"
  user_agent: "sycamore-prep/0.1 bradley.kelly93@gmail.com"
  base_url: "https://data.sec.gov"
  ticker_map_url: "https://www.sec.gov/files/company_tickers.json"
  # EDGAR full-text search (spin-off discovery). Different host (efts.sec.gov).
  fts_base_url: "https://efts.sec.gov/LATEST/search-index"
  # Max requests/sec we will issue (SEC limit is ~10).
  rate_limit_rps: 8

cache:
  dir: "data/cache"

raw:
  dir: "data/raw"
  iws_holdings: "iws_holdings.csv"
  iwn_holdings: "iwn_holdings.csv"
  sycamore_holdings: "sycamore_holdings.csv"

valuation:
  # Defaults used by reverse_dcf and the Excel models; CLI flags override.
  wacc: 0.09
  terminal_growth: 0.025
  forecast_years: 10

spinoffs:
  # Form 10 family that registers a spin-off SpinCo. `forms=10-12B` in
  # full-text search returns base + /A amendments.
  forms: ["10-12B"]
  # Default lookback window for `spinoffs scan`.
  lookback_days: 540
  # Near-universal phrase in a Form 10 information statement — used as the
  # full-text-search query so a forms-only scan still returns hits.
  query: "information statement"

# Volatility overlay (tastytrade). DOWNSIDE CROSS-CHECK ONLY — reads
# market-level IV metrics for names under research; never positions, never
# orders. Auth is OAuth2 (username/password session-tokens were discontinued
# 2025-12-01). Credentials are NOT stored here (this file is committed) — set
# them in the environment after creating an OAuth app + personal grant:
#   export TASTYTRADE_CLIENT_SECRET=...
#   export TASTYTRADE_REFRESH_TOKEN=...
tastytrade:
  base_url: "https://api.tastyworks.com"
  user_agent: "sycamore-prep/0.1 (volatility-overlay)"
  api_version: "20251101"
  # Default expected-move horizon in calendar days.
  horizon_days: 30

# Peer maps for comps. Override per-run via CLI --peers.
peers:
  CW:  ["HEI", "TDG", "MOG.A", "KTOS", "CACI"]
  WES: ["EPD", "ET", "MPLX", "PAGP"]
  UMBF: ["CFR", "PB", "PNFP", "GBCI", "ASB"]
  LECO: ["IEX", "ROP", "DOV", "PNR", "WTS"]
  MTDR: ["MGY", "PR", "SM", "CIVI", "CRGY"]

# Test tickers used in Phase 1 acceptance.
test_tickers: ["CW", "WES", "UMBF", "LECO", "MTDR"]

# Technical overlay (NON-PRIMARY context; never enters the three-attribute
# score). Surfaced by `screen --tv-overlay` as extra columns to the RIGHT of the
# downside flags. See README "TradingView technical overlay". mode selects source:
#   trend -> transparent Bull/Neutral/Bear regime computed in Python from the
#            prices we already pull (no TradingView account; fully auditable).
#   csv   -> read data/raw/<csv_file> (e.g. a custom Pine indicator's tickers).
#   api   -> replicate a built-in TradingView Stock Screener live (RSI/SMA/...).
tradingview:
  enabled: true
  mode: trend
  divergence_strong_pctile: 0.70     # "strong fundamentals" cut on the PURE composite
  pass_values: ["Bull"]              # regime/label values that count as a "pass"

  # --- mode: csv ---
  csv_file: trend_chameleon.csv      # drop in data/raw/ ; needs a `ticker` column
  signal_column: ""                  # e.g. "regime" — derive pass from this label column

  # --- mode: api (built-in Stock Screener) ---
  # Declarative replica. AND-combined. {field, op, value}. op in: gt, lt, ge, le,
  # eq, between, isin, above, below, crosses_above, crosses_below. For
  # above/below/crosses_*, value is ANOTHER FIELD NAME.
  region: america
  select: ["close", "RSI", "SMA200", "volume", "market_cap_basic"]
  filters:
    - {field: market_cap_basic, op: between, value: [300000000, 10000000000]}
    - {field: close, op: above, value: SMA200}
    - {field: RSI, op: lt, value: 70}
    - {field: volume, op: gt, value: 500000}
  cache_ttl_minutes: 1440
  max_results: 20000
  # sessionid: null    # realtime needs your own TradingView sessionid (or TV_SESSIONID)
