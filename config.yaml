# Sycamore Interview Prep Toolkit — runtime config.
# Edit edgar.user_agent before running anything that hits SEC.

edgar:
  # SEC requires a descriptive User-Agent with a real contact string.
  # Format: "Project/Version contact@example.com"
  user_agent: "sycamore-prep/0.1 bradley.kelly93@gmail.com"
  base_url: "https://data.sec.gov"
  ticker_map_url: "https://www.sec.gov/files/company_tickers.json"
  # Max requests/sec we will issue (SEC limit is ~10).
  rate_limit_rps: 8

cache:
  dir: "data/cache"

raw:
  dir: "data/raw"
  iws_holdings: "iws_holdings.csv"
  iwn_holdings: "iwn_holdings.csv"
  sycamore_holdings: "sycamore_holdings.csv"

valuation:
  # Defaults used by reverse_dcf and the Excel models; CLI flags override.
  wacc: 0.09
  terminal_growth: 0.025
  forecast_years: 10

# Peer maps for comps. Override per-run via CLI --peers.
peers:
  CW:  ["HEI", "TDG", "MOG.A", "KTOS", "CACI"]
  WES: ["EPD", "ET", "MPLX", "PAGP"]
  UMBF: ["CFR", "PB", "PNFP", "GBCI", "ASB"]
  LECO: ["IEX", "ROP", "DOV", "PNR", "WTS"]
  MTDR: ["MGY", "PR", "SM", "CIVI", "CRGY"]

# Test tickers used in Phase 1 acceptance.
test_tickers: ["CW", "WES", "UMBF", "LECO", "MTDR"]

# Prediction-market overlay (Polymarket). NON-PRIMARY signal layer — see
# CLAUDE.md. Read-only (no trading); never feeds the screener composite.
polymarket:
  gamma_base_url: "https://gamma-api.polymarket.com"
  clob_base_url: "https://clob.polymarket.com"
  rate_limit_rps: 5
  user_agent: "sycamore-prep/0.1 bradley.kelly93@gmail.com"
  # Minimum relevance (0–1) for `prediction-discover` to auto-include a match.
  min_relevance: 0.45

prediction:
  mapping_csv: "prediction_markets.csv"
  contradiction_prob: 0.20
  # Industry aperture: GICS sector → keyword searches on Polymarket.
  sector_keywords:
    Energy: ["oil price", "WTI crude", "OPEC production", "natural gas price"]
    Financials: ["bank failure", "Fed rate cut", "US recession"]
    Industrials: ["US recession", "government shutdown", "tariffs"]
    "Health Care": ["FDA approval", "Medicare", "drug pricing"]
    Materials: ["copper price", "gold price", "China GDP"]
    "Information Technology": ["AI regulation", "chip export ban"]
    "Consumer Discretionary": ["US recession", "consumer spending"]
  # Macro aperture: broad markets + the sectors they read through to.
  macro_markets:
    - query: "Fed rate cut 2026"
      applies_to: ["Financials", "Real Estate", "Utilities", "Consumer Discretionary"]
    - query: "US recession 2026"
      applies_to: ["*"]
    - query: "WTI crude oil price 2026"
      applies_to: ["Energy", "Materials"]
