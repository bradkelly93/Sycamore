# Sycamore Interview Prep Toolkit — runtime config.
# Edit edgar.user_agent before running anything that hits SEC.

edgar:
  # SEC requires a descriptive User-Agent with a real contact string.
  # Format: "Project/Version contact@example.com"
  user_agent: "sycamore-prep/0.1 bradley.kelly93@gmail.com"
  base_url: "https://data.sec.gov"
  ticker_map_url: "https://www.sec.gov/files/company_tickers.json"
  # Max requests/sec we will issue (SEC limit is ~10).
  rate_limit_rps: 8

cache:
  dir: "data/cache"

raw:
  dir: "data/raw"
  iws_holdings: "iws_holdings.csv"
  iwn_holdings: "iwn_holdings.csv"
  sycamore_holdings: "sycamore_holdings.csv"

valuation:
  # Defaults used by reverse_dcf and the Excel models; CLI flags override.
  wacc: 0.09
  terminal_growth: 0.025
  forecast_years: 10

# Peer maps for comps. Override per-run via CLI --peers.
peers:
  CW:  ["HEI", "TDG", "MOG.A", "KTOS", "CACI"]
  WES: ["EPD", "ET", "MPLX", "PAGP"]
  UMBF: ["CFR", "PB", "PNFP", "GBCI", "ASB"]
  LECO: ["IEX", "ROP", "DOV", "PNR", "WTS"]
  MTDR: ["MGY", "PR", "SM", "CIVI", "CRGY"]

# Test tickers used in Phase 1 acceptance.
test_tickers: ["CW", "WES", "UMBF", "LECO", "MTDR"]

# TradingView technical-screen overlay (NON-PRIMARY context; never enters the
# three-attribute score). Transcribe your OWN saved screen's conditions below.
# Surfaced by `screen --tv-overlay` as extra columns to the RIGHT of the
# downside flags. See README "TradingView technical overlay".
tradingview:
  enabled: true
  region: america
  # Indicator columns carried into the xlsx (prefixed `tv_`).
  select: ["close", "RSI", "SMA200", "volume", "market_cap_basic"]
  # Declarative replica of your saved screen. AND-combined. {field, op, value}.
  # op in: gt, lt, ge, le, eq, between, isin, above, below, crosses_above,
  # crosses_below. For above/below/crosses_*, value is ANOTHER FIELD NAME
  # (field-vs-field); otherwise value is a literal.
  filters:
    - {field: market_cap_basic, op: between, value: [300000000, 10000000000]}
    - {field: close, op: above, value: SMA200}     # price above its 200-day SMA
    - {field: RSI, op: lt, value: 70}
    - {field: volume, op: gt, value: 500000}
  cache_ttl_minutes: 1440      # reuse the cached snapshot within this window
  max_results: 20000
  divergence_strong_pctile: 0.70   # "strong fundamentals" cut on the PURE composite
  # sessionid: null            # realtime needs your own TradingView sessionid;
  #                            # or export TV_SESSIONID so no secret is committed.
